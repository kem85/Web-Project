<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker VY</title>
<script>
    window.userData = {
        username: "{{ username }}",
        age: "{{ age }}",
        height: "{{ height }}",
        gender: "{{ gender }}",
        weight: "{{ weight }}"
    };
</script>
<script>
    // Flask injects the value here when the page renders
    window.dbUsername = "{{ username }}";
</script>
    <!-- Corrected absolute paths for Flask -->
    <link rel="stylesheet" href="/index/style.css" />
    <link rel="stylesheet" href="/Global/Header/header.css" />
    <link rel="stylesheet" href="/Global/Navbar/navbar.css" />
    <link rel="stylesheet" href="/Global/Footer/footer.css" />
  </head>

  <body>
    <!-- HEADER (Populated by header.js) -->
    <header class="header"></header>

    <!-- NAVBAR (Populated by navbar.js) -->
    <nav class="navbar"></nav>
    <!-- PAGE TITLE -->
    <section class="page-title">
      <div class="title-left">
        <!-- Fixed image path and renamed to avoid space issues -->
        <img
          id="userPhoto"
          class="user-photo"
          src="/Profile/muslim%20cat.jpg"
          alt="user"
        />
        <h2 id="pageTitle">Today</h2>
      </div>
    </section>

    <!-- MAIN DASHBOARD -->
    <main class="dashboard">
      <div class="nutrition-card">
        <h3>Daily Nutrition Goals</h3>
        <div class="calories-input">
          <label>Calories</label>
          <input id="caloriesInput" type="number" readonly />
        </div>

        <h4>Macronutrients</h4>
        <table class="macro-table">
          <tr>
            <th>Type</th>
            <th>%</th>
            <th>grams</th>
          </tr>
          <tr>
            <td>Carbohydrates</td>
            <td>
              <select id="carbPercent">
                <option>50</option>
                <option>40</option>
                <option>60</option>
              </select>
            </td>
            <td id="carbGram">0</td>
          </tr>
          <tr>
            <td>Fat</td>
            <td>
              <select id="fatPercent">
                <option>30</option>
                <option>20</option>
                <option>40</option>
              </select>
            </td>
            <td id="fatGram">0</td>
          </tr>
          <tr>
            <td>Protein</td>
            <td>
              <select id="proteinPercent">
                <option>20</option>
                <option>30</option>
                <option>40</option>
              </select>
            </td>
            <td id="proteinGram">0</td>
          </tr>
          <tr>
            <td><b>Total</b></td>
            <td id="totalPercent">100</td>
            <td id="totalCalories"></td>
          </tr>
        </table>
      </div>

      <div class="calories-card">
        <h3>Calories</h3>
        <div class="progress-circle" aria-label="Calories progress">
          <div class="circle" id="calorieCircle">
            <div class="circle-inner">
              <span id="remainingCalories">0</span>
              <small>Remaining</small>
            </div>
          </div>
        </div>
        <div class="summary">
          <p>Base Goal: <span id="goalCalories">0</span></p>
          <p>Food: <span id="foodCalories">0</span></p>
          <p>Exercise: <span id="exerciseCalories">0</span></p>
        </div>
      </div>
    </main>

    <footer class="main-footer"></footer>

    <!-- SCRIPTS -->

    <script src="/Global/Header/header.js"></script>
    <script src="/Global/Navbar/navbar.js"></script>
    <script src="/Global/Footer/footer.js"></script>
    <script>
      createNavFromIndex();
    </script>

    <script>
      // Only call this once the scripts above have loaded
      window.onload = function () {
        if (typeof createNavFromIndex === "function") {
          createNavFromIndex();
        }
      };
    </script>

    <!-- Main Index Logic -->
    <script src="/index/script.js"></script>
  </body>
</html>
