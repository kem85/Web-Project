<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="/Global/Header/header.css">
  <link rel="stylesheet" href="/Settings/Settings.css">
</head>
<body>
  <header class="header"></header>

  <main class="settings-page">
    <section class="settings-card">
      <h1>Settings</h1>
      <p class="settings-note">This page lets you edit your profile details without opening the modal on the profile page.</p>

      <form id="settingsForm" class="settings-form">
        <label>
          Full name
          <input type="text" id="nameInput" placeholder="Your name" required>
        </label>

        <label>
          Age
          <input type="number" id="ageInput" min="1" max="120" placeholder="Age">
        </label>

        <label>
          Gender
          <select id="genderInput">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label>
          About me
          <textarea id="aboutInput" rows="3" placeholder="Tell us about yourself..."></textarea>
        </label>

        <label>
          Why I want to get in shape
          <textarea id="whyInput" rows="3" placeholder="Your motivation..."></textarea>
        </label>

        <label>
          My inspirations
          <textarea id="inspoInput" rows="3" placeholder="Who or what inspires you..."></textarea>
        </label>

        <div class="button-row">
          <button type="button" id="cancelBtn" class="secondary">Cancel</button>
          <button type="submit" class="primary">Save Changes</button>
        </div>
      </form>

      <div id="saveMessage" class="save-message" hidden>Profile saved successfully.</div>
    </section>
  </main>

  <script src="/Global/Header/header.js"></script>
  <script src="/Settings/Settings.js"></script>
</body>
</html>
