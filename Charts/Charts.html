    <!-- MAIN CONTENT -->
    <main class="dashboard">
        <div class="charts-container">

            <h2>Charts and Reports</h2>

            <div class="report-controls">
                <div class="report-select">
                    <label for="reportType">Choose a report:</label>
                    <select id="reportType">
                        <option value="weight">Weight</option>
                        <option value="calories">Calories</option>
                        <option value="water">Water Intake</option>
                        <option value="steps">Steps</option>
                    </select>
                </div>

                <div class="export-btn-container">
                    <button type="button" id="exportChartBtn">EXPORT</button>
                </div>
            </div>

            <div class="report-period">
                <h3>Reporting period:</h3>
                <div class="period-links">
                    <a href="#" data-days="7" class="active-period">Last 7 days</a>
                    <a href="#" data-days="30">Last 30 days</a>
                    <a href="#" data-days="90">Last 90 days</a>
                    <a href="#" data-days="180">Last 180 days</a>
                    <a href="#" data-days="365">Last year</a>
                </div>
            </div>

           <div class="chart-card">
                <h3 id="chartTitle">Weight</h3>
                <canvas id="reportChart" aria-label="Selected fitness report chart"></canvas>
                <p id="chartEmptyMessage" class="chart-empty" hidden>No saved data yet. Add data in Check-In or Food Diary first.</p>
            </div>

        </div> 
    </main>
