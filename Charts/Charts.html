<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Charts - Fitness Tracker VY</title>
    <script>
      window.dbUsername = "{{ username }}";
    </script>
    <link rel="stylesheet" href="/Charts/Charts.css" />
    <link rel="stylesheet" href="/Global/Header/header.css" />
    <link rel="stylesheet" href="/Global/Navbar/navbar.css" />
    <link rel="stylesheet" href="/Global/Footer/footer.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <!-- <div class="logo">
            <h1><a href="/">myfitnesspal</a></h1>
        </div>

        <div class="user-section">
            <span>Hi <span id="username">User</span></span>
            <a href="#">Help</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </div> -->
    </header>

    <!-- NAVBAR -->
    <nav class="navbar">
      <!-- <ul>
            <li><a href="/">My Home</a></li>
            <li><a href="/check_in">Check in</a></li>
            <li><a href="/food_diary">Food Diary</a></li>
            <li class="active"><a href="/charts">Charts</a></li>
            <li><a href="/profile">Profile</a></li>
        </ul> -->
    </nav>

    <!-- MAIN CONTENT -->
    <main class="dashboard">
      <div class="charts-container">
        <h2>Charts and Reports</h2>

        <div class="report-controls">
          <div class="report-select">
            <label for="reportType">Choose a report:</label>
            <select id="reportType">
              <option value="weight">Weight</option>
              <option value="calories">Calories</option>
              <option value="water">Water Intake</option>
              <option value="steps">Steps</option>
            </select>
          </div>

          <div class="export-btn-container">
            <button type="button" id="exportChartBtn">EXPORT</button>
          </div>
        </div>

        <div class="report-period">
          <h3>Reporting period:</h3>
          <div class="period-links">
            <a href="#" data-days="7" class="active-period">Last 7 days</a>
            <a href="#" data-days="30">Last 30 days</a>
            <a href="#" data-days="90">Last 90 days</a>
            <a href="#" data-days="180">Last 180 days</a>
            <a href="#" data-days="365">Last year</a>
          </div>
        </div>

        <div class="chart-card">
          <h3 id="chartTitle">Weight</h3>
          <canvas
            id="reportChart"
            aria-label="Selected fitness report chart"
          ></canvas>
          <p id="chartEmptyMessage" class="chart-empty" hidden>
            No saved data yet. Add data in Check-In or Food Diary first.
          </p>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="main-footer"></footer>

    <script src="/Global/Header/header.js"></script>
    <script src="/Global/Navbar/navbar.js"></script>
    <script>
      createNavFromCharts();
    </script>
    <script src="/Global/Footer/footer.js"></script>
    <script src="/Charts/Charts.js"></script>
  </body>
</html>
